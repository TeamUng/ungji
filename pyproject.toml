[project]
name = "ungji"
version = "0.1.0"
description = "Chatbot-styled study coach for Korean elementary schoolers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "logtail-python>=0.3",
    "langgraph>=0.4",
    "langchain-upstage>=0.3",
    "langchain-openai>=0.2",
    "langsmith>=0.3",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
